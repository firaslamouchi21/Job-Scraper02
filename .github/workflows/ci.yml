name: ci
on:
  push:
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: python-compile
        run: |
          python -m compileall -q .
      - name: cli-smoke
        run: |
          python cli.py export --format json --limit 1
      - name: docker-build
        run: |
          docker compose build
      - name: scraper-health
        shell: bash
        run: |
          docker compose up -d scraper
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs scraper || true
          exit 1
      - name: pytest-health-tests
        run: |
          python -m pytest health_test/ -v --tb=short
      - name: docker-down
        if: always()
        run: |
          docker compose down -v

  publish-to-pypi:
    needs: build-and-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/job-scraper02
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install-build-tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: build-package
        run: python -m build
      - name: publish-to-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
